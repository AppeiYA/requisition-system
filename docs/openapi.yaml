    /attachments:
        get:
            description: Returns a paginated list of attachments for one parent resource.
            parameters:
                - description: Parent type (requisition or requisition_item)
                  in: query
                  name: ref_name
                  required: true
                  schema:
                    enum:
                        - requisition
                        - requisition_item
                    type: string
                - description: Parent id
                  in: query
                  name: ref_id
                  required: true
                  schema:
                    type: string
                - description: Page size (1-100)
                  in: query
                  name: limit
                  schema:
                    type: integer
                - description: Page offset
                  in: query
                  name: offset
                  schema:
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/response.Response'
                                    - properties:
                                        data:
                                            items:
                                                $ref: '#/components/schemas/attachmenthttp.AttachmentResponse'
                                            type: array
                                      type: object
                    description: OK
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.ErrorResponse'
                    description: Missing ref_name/ref_id or invalid pagination
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.Response'
                    description: Missing or invalid access token
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.Response'
                    description: Access to the parent resource denied
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.Response'
                    description: Parent resource not found
            security:
                - BearerAuth: []
            summary: List attachments
            tags:
                - attachment
        post:
            description: Streams a file to storage and records its metadata against a requisition or requisition item. The content type is detected from the file bytes, not from the declared type.
            requestBody:
                content:
                    multipart/form-data:
                        schema:
                            properties:
                                file:
                                    description: File to upload
                                    format: binary
                                    type: string
                                    x-formData-name: file
                                ref_id:
                                    description: Parent id
                                    type: string
                                    x-formData-name: ref_id
                                ref_name:
                                    description: Parent type (requisition or requisition_item)
                                    enum:
                                        - requisition
                                        - requisition_item
                                    type: string
                                    x-formData-name: ref_name
                            required:
                                - file
                                - ref_id
                                - ref_name
                            type: object
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/response.Response'
                                    - properties:
                                        data:
                                            $ref: '#/components/schemas/attachmenthttp.AttachmentResponse'
                                      type: object
                    description: Created
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.ErrorResponse'
                    description: Invalid multipart body
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.Response'
                    description: Missing or invalid access token
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.Response'
                    description: Access to the parent resource denied
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.Response'
                    description: Parent resource not found
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.Response'
                    description: Attachment limit for the parent reached
                "413":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.Response'
                    description: File exceeds the configured size limit
                "415":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.Response'
                    description: Unsupported content type
            security:
                - BearerAuth: []
            summary: Upload an attachment
            tags:
                - attachment
