components:
    schemas:
        adminhttp.InvitationDetailResponse:
            properties:
                accepted_at:
                    type: string
                created_at:
                    type: string
                delivered_at:
                    type: string
                delivery_failed_at:
                    type: string
                department_id:
                    type: string
                department_name:
                    type: string
                email:
                    type: string
                expires_at:
                    type: string
                first_name:
                    type: string
                id:
                    type: string
                invited_by:
                    type: string
                inviter_name:
                    type: string
                job_title:
                    type: string
                last_name:
                    type: string
                revoked_at:
                    type: string
                status:
                    type: string
            type: object
        adminhttp.InvitationSummaryResponse:
            properties:
                accepted_at:
                    type: string
                created_at:
                    type: string
                delivered_at:
                    type: string
                delivery_failed_at:
                    type: string
                department_id:
                    type: string
                department_name:
                    type: string
                email:
                    type: string
                expires_at:
                    type: string
                first_name:
                    type: string
                id:
                    type: string
                invited_by:
                    type: string
                inviter_name:
                    type: string
                job_title:
                    type: string
                last_name:
                    type: string
                revoked_at:
                    type: string
                status:
                    type: string
            type: object
        adminhttp.InviteRequest:
            properties:
                department_id:
                    type: string
                email:
                    type: string
                first_name:
                    type: string
                job_title:
                    maxLength: 60
                    type: string
                last_name:
                    type: string
                phone:
                    type: string
                staff_id:
                    type: string
            required:
                - department_id
                - email
                - first_name
                - job_title
                - last_name
            type: object
        adminhttp.ResendInvitationResponse:
            properties:
                expires_at:
                    type: string
                id:
                    type: string
            type: object
        adminhttp.UpdateUserRoleRequest:
            properties:
                reason:
                    maxLength: 500
                    type: string
                role:
                    enum:
                        - admin
                        - user
                    type: string
            required:
                - role
            type: object
        adminhttp.UpdateUserStatusRequest:
            properties:
                reason:
                    maxLength: 500
                    type: string
                status:
                    enum:
                        - active
                        - suspended
                        - inactive
                    type: string
            required:
                - status
            type: object
        adminhttp.UserDetailResponse:
            properties:
                created_at:
                    type: string
                department_id:
                    type: string
                department_name:
                    type: string
                email:
                    type: string
                first_name:
                    type: string
                id:
                    type: string
                job_title:
                    type: string
                last_name:
                    type: string
                last_requisition_at:
                    type: string
                membership_status:
                    type: string
                phone:
                    type: string
                requisition_counts:
                    additionalProperties:
                        type: integer
                    type: object
                role:
                    type: string
                staff_id:
                    type: string
                status:
                    type: string
                total_estimated_amount:
                    type: number
                updated_at:
                    type: string
            type: object
        adminhttp.UserSummaryResponse:
            properties:
                created_at:
                    type: string
                department_id:
                    type: string
                department_name:
                    type: string
                email:
                    type: string
                first_name:
                    type: string
                id:
                    type: string
                job_title:
                    type: string
                last_name:
                    type: string
                membership_status:
                    type: string
                phone:
                    type: string
                role:
                    type: string
                staff_id:
                    type: string
                status:
                    type: string
                updated_at:
                    type: string
            type: object
        adminin.InviteMemberResult:
            properties:
                invitationID:
                    type: string
            type: object
        attachmenthttp.AttachmentResponse:
            properties:
                checksum:
                    type: string
                content_type:
                    type: string
                created_at:
                    type: string
                file_name:
                    type: string
                file_size:
                    type: integer
                id:
                    type: string
                ref_id:
                    type: string
                ref_name:
                    type: string
                uploaded_by:
                    type: string
                url:
                    type: string
            type: object
        attachmenthttp.StagedUploadResponse:
            properties:
                checksum:
                    type: string
                content_type:
                    type: string
                created_at:
                    type: string
                expires_at:
                    type: string
                file_name:
                    type: string
                file_size:
                    type: integer
                id:
                    type: string
                status:
                    type: string
                uploaded_by:
                    type: string
            type: object
        category.CreateItemCategoryRequest:
            properties:
                description:
                    type: string
                name:
                    type: string
            required:
                - name
            type: object
        category.ItemCategoryResponse:
            properties:
                created_at:
                    type: string
                description:
                    type: string
                id:
                    type: string
                name:
                    type: string
                status:
                    type: string
            type: object
        category.UpdateItemCategoryRequest:
            properties:
                description:
                    type: string
                name:
                    type: string
            type: object
        departmenthttp.CreateDepartmentRequest:
            properties:
                code:
                    type: string
                description:
                    type: string
                name:
                    type: string
            required:
                - code
                - description
                - name
            type: object
        departmenthttp.DepartmentResponse:
            properties:
                code:
                    type: string
                description:
                    type: string
                id:
                    type: string
                name:
                    type: string
                status:
                    type: string
            type: object
        departmentin.CreateDepartmentResult:
            properties:
                code:
                    type: string
                createdAt:
                    type: string
                description:
                    type: string
                id:
                    type: string
                name:
                    type: string
                status:
                    type: string
            type: object
        departmentin.DepartmentResult:
            properties:
                code:
                    type: string
                createdAt:
                    type: string
                description:
                    type: string
                id:
                    type: string
                name:
                    type: string
                status:
                    type: string
            type: object
        identityhttp.User:
            properties:
                created_at:
                    type: string
                email:
                    type: string
                first_name:
                    type: string
                id:
                    type: string
                last_name:
                    type: string
                phone:
                    type: string
                staff_id:
                    type: string
                updated_at:
                    type: string
            type: object
        identityhttp.forgotPasswordRequest:
            properties:
                email:
                    type: string
            required:
                - email
            type: object
        identityhttp.loginRequest:
            properties:
                email:
                    type: string
                password:
                    type: string
            required:
                - email
                - password
            type: object
        identityhttp.logoutRequest:
            properties:
                refresh_token:
                    type: string
            required:
                - refresh_token
            type: object
        identityhttp.refreshRequest:
            properties:
                refresh_token:
                    type: string
            required:
                - refresh_token
            type: object
        identityhttp.resetPasswordRequest:
            properties:
                password:
                    type: string
                token:
                    type: string
            required:
                - password
                - token
            type: object
        identityin.TokenResponse:
            properties:
                access_token:
                    type: string
                expires_in:
                    type: integer
                refresh_token:
                    type: string
                token_type:
                    type: string
            type: object
        invitationhttp.AcceptInvitationRequest:
            properties:
                password:
                    type: string
                phone:
                    type: string
            required:
                - password
            type: object
        invitationhttp.ValidateInvitationResponse:
            properties:
                department_id:
                    type: string
                email:
                    type: string
                first_name:
                    type: string
                job_title:
                    type: string
                last_name:
                    type: string
                phone:
                    type: string
                staff_id:
                    type: string
                valid:
                    type: boolean
            type: object
        item.CreateItemRequest:
            properties:
                category_id:
                    type: string
                description:
                    type: string
                name:
                    type: string
                unit_cost:
                    minimum: 0
                    type: number
            required:
                - category_id
                - name
            type: object
        item.ItemResponse:
            properties:
                category_id:
                    type: string
                created_at:
                    type: string
                currency:
                    type: string
                description:
                    type: string
                id:
                    type: string
                name:
                    type: string
                status:
                    type: string
                unit_cost:
                    type: number
            type: object
        item.PromoteRequestedItemRequest:
            properties:
                unit_cost:
                    minimum: 0
                    type: number
            type: object
        item.RequestedItemResponse:
            properties:
                category_id:
                    type: string
                created_at:
                    type: string
                created_by:
                    type: string
                description:
                    type: string
                id:
                    type: string
                name:
                    type: string
                review_status:
                    type: string
                reviewed_at:
                    type: string
                reviewed_by:
                    type: string
            type: object
        item.UpdateItemRequest:
            properties:
                category_id:
                    type: string
                description:
                    type: string
                name:
                    type: string
                unit_cost:
                    minimum: 0
                    type: number
            type: object
        requisitionhttp.CreateRequestedItemRequest:
            properties:
                category_id:
                    example: cat_123
                    minLength: 1
                    type: string
                description:
                    example: Adjustable laptop stand
                    maxLength: 200
                    minLength: 1
                    type: string
                name:
                    example: Laptop stand
                    maxLength: 100
                    minLength: 1
                    type: string
            type: object
        requisitionhttp.CreateRequisitionLineRequest:
            properties:
                estimated_unit_amount:
                    example: 50000
                    type: number
                item_id:
                    example: itm_123
                    type: string
                notes:
                    example: Optional note
                    type: string
                quantity:
                    example: 2
                    maximum: 1000
                    minimum: 1
                    type: integer
                requested_item:
                    $ref: '#/components/schemas/requisitionhttp.CreateRequestedItemRequest'
                upload_ids:
                    example:
                        - upl-123
                    items:
                        type: string
                    type: array
            type: object
        requisitionhttp.CreateRequisitionRequest:
            properties:
                department_id:
                    example: dpt_123
                    minLength: 1
                    type: string
                justification:
                    example: Replacement laptops for the new hires
                    maxLength: 500
                    minLength: 1
                    type: string
                lines:
                    items:
                        $ref: '#/components/schemas/requisitionhttp.CreateRequisitionLineRequest'
                    minItems: 1
                    type: array
                needed_by:
                    example: "2026-11-15"
                    type: string
                priority:
                    enum:
                        - low
                        - normal
                        - medium
                        - high
                        - urgent
                    example: medium
                    type: string
                upload_ids:
                    description: UploadIDs reference files previously staged through POST /api/v1/uploads.
                    example:
                        - upl-123
                    items:
                        type: string
                    type: array
            required:
                - department_id
                - justification
                - lines
                - needed_by
            type: object
        requisitionhttp.RequisitionLineResponse:
            properties:
                estimated_unit_amount:
                    type: number
                id:
                    type: string
                item_id:
                    type: string
                item_name:
                    type: string
                line_number:
                    type: integer
                line_total:
                    type: number
                notes:
                    type: string
                quantity:
                    type: integer
                requested_item_id:
                    type: string
            type: object
        requisitionhttp.RequisitionOwnerResponse:
            properties:
                email:
                    type: string
                first_name:
                    type: string
                id:
                    type: string
                last_name:
                    type: string
            type: object
        requisitionhttp.RequisitionResponse:
            properties:
                created_at:
                    type: string
                currency:
                    type: string
                department_id:
                    type: string
                id:
                    type: string
                justification:
                    type: string
                lines:
                    items:
                        $ref: '#/components/schemas/requisitionhttp.RequisitionLineResponse'
                    type: array
                needed_by:
                    type: string
                priority:
                    type: string
                reference_code:
                    type: string
                requested_by:
                    type: string
                status:
                    type: string
                status_history:
                    items:
                        $ref: '#/components/schemas/requisitionhttp.RequisitionStatusHistoryResponse'
                    type: array
                total_estimated_amount:
                    type: number
                updated_at:
                    type: string
            type: object
        requisitionhttp.RequisitionStatusHistoryResponse:
            properties:
                acted_by:
                    type: string
                actor_role:
                    type: string
                created_at:
                    type: string
                from_status:
                    type: string
                reason:
                    type: string
                sequence:
                    type: integer
                to_status:
                    type: string
            type: object
        requisitionhttp.RequisitionSummaryResponse:
            properties:
                created_at:
                    type: string
                department_id:
                    type: string
                id:
                    type: string
                justification:
                    type: string
                needed_by:
                    type: string
                owner:
                    $ref: '#/components/schemas/requisitionhttp.RequisitionOwnerResponse'
                priority:
                    type: string
                reference_code:
                    type: string
                requested_by:
                    type: string
                status:
                    type: string
                total_estimated_amount:
                    type: number
                updated_at:
                    type: string
            type: object
        requisitionhttp.TransitionRequisitionStatusRequest:
            properties:
                reason:
                    example: Approved by department administrator
                    type: string
                to_status:
                    example: approved
                    type: string
            required:
                - to_status
            type: object
        requisitionhttp.UpdateRequisitionLineRequest:
            properties:
                estimated_unit_amount:
                    example: 50000
                    type: number
                item_id:
                    example: itm_123
                    type: string
                notes:
                    example: Optional note
                    type: string
                quantity:
                    example: 2
                    maximum: 1000
                    minimum: 1
                    type: integer
                requested_item:
                    $ref: '#/components/schemas/requisitionhttp.CreateRequestedItemRequest'
                requisition_item_id:
                    example: reqitem_123
                    type: string
            type: object
        requisitionhttp.UpdateRequisitionRequest:
            properties:
                department_id:
                    example: dpt_123
                    minLength: 1
                    type: string
                justification:
                    example: Replacement laptops for the new hires
                    maxLength: 500
                    minLength: 1
                    type: string
                lines:
                    items:
                        $ref: '#/components/schemas/requisitionhttp.UpdateRequisitionLineRequest'
                    minItems: 1
                    type: array
                needed_by:
                    example: "2026-11-15"
                    type: string
                priority:
                    enum:
                        - low
                        - normal
                        - medium
                        - high
                        - urgent
                    example: medium
                    type: string
            required:
                - department_id
                - justification
                - lines
                - needed_by
            type: object
        response.ErrorResponse:
            properties:
                data: {}
                details:
                    items:
                        $ref: '#/components/schemas/response.FieldError'
                    type: array
                error:
                    type: string
                message:
                    type: string
                success:
                    type: boolean
            type: object
        response.FieldError:
            properties:
                field:
                    type: string
                message:
                    type: string
            type: object
        response.Response:
            properties:
                data: {}
                message:
                    type: string
                success:
                    type: boolean
            type: object
    securitySchemes:
        BearerAuth:
            description: Type "Bearer" followed by a space and the access token.
            scheme: bearer
            type: http
info:
    contact: {}
    description: Requisition System REST API.
    title: Requisition System API
    version: "1.0"
openapi: 3.0.3
paths:
    /admin/analytics/catalogue:
        get:
            parameters:
                - description: Start time
                  in: query
                  name: from
                  schema:
                    type: string
                - description: End time
                  in: query
                  name: to
                  schema:
                    type: string
                - description: Department ID
                  in: query
                  name: department_id
                  schema:
                    type: string
                - description: Top-list limit
                  in: query
                  name: limit
                  schema:
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.Response'
                    description: OK
            security:
                - BearerAuth: []
            summary: Get catalogue analytics
            tags:
                - admin
    /admin/analytics/overview:
        get:
            parameters:
                - description: Start time (RFC3339 or YYYY-MM-DD)
                  in: query
                  name: from
                  schema:
                    type: string
                - description: End time (RFC3339 or YYYY-MM-DD)
                  in: query
                  name: to
                  schema:
                    type: string
                - description: Department ID
                  in: query
                  name: department_id
                  schema:
                    type: string
                - description: day, week or month
                  in: query
                  name: interval
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.Response'
                    description: OK
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.ErrorResponse'
                    description: Bad Request
            security:
                - BearerAuth: []
            summary: Get analytics overview
            tags:
                - admin
    /admin/analytics/requisitions:
        get:
            parameters:
                - description: Start time
                  in: query
                  name: from
                  schema:
                    type: string
                - description: End time
                  in: query
                  name: to
                  schema:
                    type: string
                - description: Department ID
                  in: query
                  name: department_id
                  schema:
                    type: string
                - description: day, week or month
                  in: query
                  name: interval
                  schema:
                    type: string
                - description: Top-list limit
                  in: query
                  name: limit
                  schema:
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.Response'
                    description: OK
            security:
                - BearerAuth: []
            summary: Get requisition analytics
            tags:
                - admin
    /admin/analytics/users:
        get:
            parameters:
                - description: Start time
                  in: query
                  name: from
                  schema:
                    type: string
                - description: End time
                  in: query
                  name: to
                  schema:
                    type: string
                - description: day, week or month
                  in: query
                  name: interval
                  schema:
                    type: string
                - description: Top-list limit
                  in: query
                  name: limit
                  schema:
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.Response'
                    description: OK
            security:
                - BearerAuth: []
            summary: Get user analytics
            tags:
                - admin
    /admin/invitations:
        get:
            description: Search, filter and paginate invitations. Requires the admin role. Token hashes are never returned.
            parameters:
                - description: Search by email or name
                  in: query
                  name: q
                  schema:
                    type: string
                - description: pending, delivered, failed, accepted, revoked or expired
                  in: query
                  name: status
                  schema:
                    type: string
                - description: Department ID
                  in: query
                  name: department_id
                  schema:
                    type: string
                - description: Inviter user ID
                  in: query
                  name: invited_by
                  schema:
                    type: string
                - description: Created at from (RFC3339 or YYYY-MM-DD, UTC)
                  in: query
                  name: from
                  schema:
                    type: string
                - description: Created at before (RFC3339 or YYYY-MM-DD, UTC)
                  in: query
                  name: to
                  schema:
                    type: string
                - description: Page size (max 100)
                  in: query
                  name: limit
                  schema:
                    type: integer
                - description: Offset
                  in: query
                  name: offset
                  schema:
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/response.Response'
                                    - properties:
                                        data:
                                            items:
                                                $ref: '#/components/schemas/adminhttp.InvitationSummaryResponse'
                                            type: array
                                      type: object
                    description: OK
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.ErrorResponse'
                    description: Validation error
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.Response'
                    description: Missing or invalid access token
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.Response'
                    description: Authenticated user is not an admin
            security:
                - BearerAuth: []
            summary: List invitations
            tags:
                - admin
        post:
            description: Creates a pending invitation for the given email and department and emails the invitation link. Requires the admin role.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/adminhttp.InviteRequest'
                description: Invitation details
                required: true
                x-originalParamName: request
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/response.Response'
                                    - properties:
                                        data:
                                            $ref: '#/components/schemas/adminin.InviteMemberResult'
                                      type: object
                    description: Created
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.ErrorResponse'
                    description: Validation error
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.Response'
                    description: Missing or invalid access token
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.Response'
                    description: Authenticated user is not an admin
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.Response'
                    description: Invitation already exists
            security:
                - BearerAuth: []
            summary: Invite a member
            tags:
                - admin
    /admin/invitations/{id}:
        get:
            description: Get one invitation with its department and inviter names. Requires the admin role.
            parameters:
                - description: Invitation ID
                  in: path
                  name: id
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/response.Response'
                                    - properties:
                                        data:
                                            $ref: '#/components/schemas/adminhttp.InvitationDetailResponse'
                                      type: object
                    description: OK
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.ErrorResponse'
                    description: Invalid invitation ID
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.Response'
                    description: Missing or invalid access token
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.Response'
                    description: Authenticated user is not an admin
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.Response'
                    description: Invitation not found
            security:
                - BearerAuth: []
            summary: Get invitation
            tags:
                - admin
    /admin/invitations/{id}/resend:
        post:
            description: Rotate the invitation token, audit the change and queue a replacement email. Accepted and revoked invitations cannot be resent. Requires the admin role.
            parameters:
                - description: Invitation ID
                  in: path
                  name: id
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/response.Response'
                                    - properties:
                                        data:
                                            $ref: '#/components/schemas/adminhttp.ResendInvitationResponse'
                                      type: object
                    description: OK
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.ErrorResponse'
                    description: Invalid invitation ID
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.Response'
                    description: Missing or invalid access token
                "403":
                    content:
                        application/json:
                            schema:
