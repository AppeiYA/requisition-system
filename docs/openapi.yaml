                                        data:
                                            $ref: '#/components/schemas/requisitionhttp.RequisitionResponse'
                                      type: object
                    description: Created
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.ErrorResponse'
                    description: Validation error
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.Response'
                    description: Missing or invalid access token
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.Response'
                    description: Department membership is inactive or belongs to another department
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.Response'
                    description: Department membership, category, or item not found
            security:
                - BearerAuth: []
            summary: Create a requisition
            tags:
                - requisition
