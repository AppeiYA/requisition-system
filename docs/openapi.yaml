    /requisitions:
        get:
            description: Returns requisitions created by the authenticated user, ordered by creation time (newest first). Requires an access token.
            parameters:
                - description: Maximum number of requisitions to return (default 100, max 100)
                  in: query
                  name: limit
                  schema:
                    type: integer
                - description: Number of requisitions to skip (default 0)
                  in: query
                  name: offset
                  schema:
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/response.Response'
                                    - properties:
                                        data:
                                            items:
                                                $ref: '#/components/schemas/requisitionhttp.RequisitionResponse'
