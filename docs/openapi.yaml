                            schema:
                                $ref: '#/components/schemas/response.Response'
                    description: Missing or invalid access token
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.Response'
                    description: Requisition belongs to another user
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.Response'
                    description: Requisition not found
            security:
                - BearerAuth: []
            summary: Get a requisition
            tags:
                - requisition
        patch:
            description: Replaces the header and line values of a pending requisition owned by the authenticated requester. Amounts are expressed in major currency units (naira for NGN) and stored internally as minor units.
            parameters:
                - description: Requisition ID
                  in: path
                  name: id
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/requisitionhttp.UpdateRequisitionRequest'
                description: Updated requisition details. Include requisition_item_id on existing lines to preserve their identity.
                required: true
                x-originalParamName: request
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/response.Response'
                                    - properties:
                                        data:
                                            $ref: '#/components/schemas/requisitionhttp.RequisitionResponse'
                                      type: object
                    description: OK
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.ErrorResponse'
                    description: Validation error
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.Response'
                    description: Missing or invalid access token
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.Response'
                    description: Requester does not own the requisition
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.Response'
                    description: Requisition is no longer pending
            security:
                - BearerAuth: []
            summary: Update a pending requisition
            tags:
                - requisition
    /requisitions/{id}/status:
        post:
            description: Applies a status transition and records it in the append-only status history. A reason is required for rejected and cancelled. Requesters may only cancel their own pending requisition; approval, rejection, fulfillment, and completion require an administrator. Returns the complete updated requisition. Amounts are expressed in major currency units (naira for NGN) while stored internally as minor units.
            parameters:
                - description: Requisition ID
                  in: path
                  name: id
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/requisitionhttp.TransitionRequisitionStatusRequest'
                description: Target status and optional reason
                required: true
                x-originalParamName: request
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/response.Response'
                                    - properties:
                                        data:
                                            $ref: '#/components/schemas/requisitionhttp.RequisitionResponse'
                                      type: object
                    description: OK
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.ErrorResponse'
                    description: Invalid status, missing reason, or invalid transition
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.Response'
                    description: Missing or invalid access token
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.Response'
                    description: Actor is not authorized for this transition
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.Response'
                    description: Requisition not found
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.Response'
                    description: Concurrent status change
            security:
                - BearerAuth: []
            summary: Transition a requisition status
            tags:
                - requisition
    /requisitions/all:
        get:
            description: Returns header summaries for all requisitions, ordered by creation time (newest first), including the requesting user's owner details and the derived total but excluding lines and status history. Use GET /requisitions/{id} for the full detail. Amounts are expressed in major currency units (naira for NGN) while stored internally as minor units. Requires an access token and admin role.
            parameters:
                - description: Maximum number of requisitions to return (default 100, max 100)
                  in: query
                  name: limit
                  schema:
                    type: integer
                - description: Number of requisitions to skip (default 0)
                  in: query
                  name: offset
                  schema:
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/response.Response'
                                    - properties:
                                        data:
                                            items:
                                                $ref: '#/components/schemas/requisitionhttp.RequisitionSummaryResponse'
                                            type: array
                                      type: object
                    description: OK
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.Response'
                    description: Invalid pagination parameters
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.Response'
                    description: Missing or invalid access token
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.Response'
                    description: Forbidden
            security:
                - BearerAuth: []
            summary: List all requisitions
            tags:
                - requisition
    /uploads:
        post:
            description: Streams a file to temporary storage and records its owner. No requisition or requisition-item ID is required; pass the returned ID in the requisition creation payload.
            requestBody:
                content:
                    multipart/form-data:
                        schema:
                            properties:
                                file:
                                    description: File to stage
                                    format: binary
                                    type: string
                                    x-formData-name: file
                            required:
                                - file
                            type: object
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/response.Response'
                                    - properties:
                                        data:
                                            $ref: '#/components/schemas/attachmenthttp.StagedUploadResponse'
                                      type: object
                    description: Created
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.ErrorResponse'
                    description: Invalid multipart body
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.Response'
                    description: Missing or invalid access token
                "413":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.Response'
                    description: File exceeds the configured size limit
                "415":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.Response'
                    description: Unsupported content type
            security:
                - BearerAuth: []
            summary: Stage a file before creating a requisition
            tags:
                - attachment
servers:
    - url: /api/v1
