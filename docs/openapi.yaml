components:
    schemas:
        adminhttp.InviteRequest:
            properties:
                departmentId:
                    type: string
                email:
                    type: string
                firstName:
                    type: string
                jobTitle:
                    maxLength: 60
                    type: string
                lastName:
                    type: string
                phone:
                    type: string
                staffId:
                    type: string
            required:
                - departmentId
                - email
                - firstName
                - jobTitle
                - lastName
            type: object
        adminin.InviteMemberResult:
            properties:
                invitationID:
                    type: string
            type: object
        category.CreateItemCategoryRequest:
            properties:
                description:
                    type: string
                name:
                    type: string
            required:
                - name
            type: object
        category.ItemCategoryResponse:
            properties:
                created_at:
                    type: string
                description:
                    type: string
                id:
                    type: string
                name:
                    type: string
                status:
                    type: string
            type: object
        category.UpdateItemCategoryRequest:
            properties:
                description:
                    type: string
                name:
                    type: string
            type: object
        departmenthttp.CreateDepartmentRequest:
            properties:
                code:
                    type: string
                description:
                    type: string
                name:
                    type: string
            required:
                - code
                - description
                - name
            type: object
        departmenthttp.DepartmentResponse:
            properties:
                code:
                    type: string
                description:
                    type: string
                id:
                    type: string
                name:
                    type: string
                status:
                    type: string
            type: object
        departmentin.CreateDepartmentResult:
            properties:
                code:
                    type: string
                createdAt:
                    type: string
                description:
                    type: string
                id:
                    type: string
                name:
                    type: string
                status:
                    type: string
            type: object
        departmentin.DepartmentResult:
            properties:
                code:
                    type: string
                createdAt:
                    type: string
                description:
                    type: string
                id:
                    type: string
                name:
                    type: string
                status:
                    type: string
            type: object
        identityhttp.User:
            properties:
                created_at:
                    type: string
                email:
                    type: string
                first_name:
                    type: string
                id:
                    type: string
                last_name:
                    type: string
                phone:
                    type: string
                staff_id:
                    type: string
                updated_at:
                    type: string
            type: object
        identityhttp.loginRequest:
            properties:
                email:
                    type: string
                password:
                    type: string
            required:
                - email
                - password
            type: object
        identityhttp.logoutRequest:
            properties:
                refresh_token:
                    type: string
            required:
                - refresh_token
            type: object
        identityhttp.refreshRequest:
            properties:
                refresh_token:
                    type: string
            required:
                - refresh_token
            type: object
        identityin.TokenResponse:
            properties:
                access_token:
                    type: string
                expires_in:
                    type: integer
                refresh_token:
                    type: string
                token_type:
                    type: string
            type: object
        invitationhttp.AcceptInvitationRequest:
            properties:
                password:
                    type: string
                phone:
                    type: string
            required:
                - password
            type: object
        invitationhttp.ValidateInvitationResponse:
            properties:
                departmentId:
                    type: string
                email:
                    type: string
                firstName:
                    type: string
                jobTitle:
                    type: string
                lastName:
                    type: string
                phone:
                    type: string
                staffId:
                    type: string
                valid:
                    type: boolean
            type: object
        item.CreateItemRequest:
            properties:
                category_id:
                    type: string
                description:
                    type: string
                name:
                    type: string
                unit_cost:
                    minimum: 0
                    type: number
            required:
                - category_id
                - name
            type: object
        item.ItemResponse:
            properties:
                category_id:
                    type: string
                created_at:
                    type: string
                currency:
                    type: string
                description:
                    type: string
                id:
                    type: string
                name:
                    type: string
                status:
                    type: string
                unit_cost:
                    type: number
            type: object
        item.UpdateItemRequest:
            properties:
                category_id:
                    type: string
                description:
                    type: string
                name:
                    type: string
                unit_cost:
                    minimum: 0
                    type: number
            type: object
        requisitionhttp.CreateRequisitionRequest:
            properties:
                category_id:
                    type: string
                estimated_cost:
                    minimum: 0
                    type: number
                item_id:
                    type: string
                justification:
                    type: string
                needed_by:
                    type: string
                priority:
                    type: string
                quantity:
                    minimum: 1
                    type: integer
                requested_item_description:
                    type: string
                requested_item_name:
                    type: string
            required:
                - category_id
                - justification
                - needed_by
                - priority
                - quantity
                - requested_item_description
                - requested_item_name
            type: object
        requisitionhttp.RequisitionResponse:
            properties:
                category_id:
                    type: string
                created_at:
                    type: string
                currency:
                    type: string
                department_id:
                    type: string
                estimated_cost:
                    type: number
                id:
                    type: string
                item_id:
                    type: string
                justification:
                    type: string
                needed_by:
                    type: string
                priority:
                    type: string
                quantity:
                    type: integer
                requested_by:
                    type: string
                requested_item_description:
                    type: string
                requested_item_name:
                    type: string
                status:
                    type: string
                updated_at:
                    type: string
            type: object
        response.ErrorResponse:
            properties:
                data: {}
                details:
                    items:
                        $ref: '#/components/schemas/response.FieldError'
                    type: array
                error:
                    type: string
                message:
                    type: string
                success:
                    type: boolean
            type: object
        response.FieldError:
            properties:
                field:
                    type: string
                message:
                    type: string
            type: object
        response.Response:
            properties:
                data: {}
                message:
                    type: string
                success:
                    type: boolean
            type: object
    securitySchemes:
        BearerAuth:
            description: Type "Bearer" followed by a space and the access token.
            scheme: bearer
            type: http
info:
    contact: {}
    description: Requisition System REST API.
    title: Requisition System API
    version: "1.0"
openapi: 3.0.3
paths:
    /admin/invitations:
        post:
            description: Creates a pending invitation for the given email and department and emails the invitation link. Requires the admin role.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/adminhttp.InviteRequest'
                description: Invitation details
                required: true
                x-originalParamName: request
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/response.Response'
                                    - properties:
                                        data:
                                            $ref: '#/components/schemas/adminin.InviteMemberResult'
                                      type: object
                    description: Created
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.ErrorResponse'
                    description: Validation error
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.Response'
                    description: Missing or invalid access token
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.Response'
                    description: Authenticated user is not an admin
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.Response'
                    description: Invitation already exists
            security:
                - BearerAuth: []
            summary: Invite a member
            tags:
                - admin
    /auth/login:
        post:
            description: Validates the given credentials and returns a new access/refresh token pair.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/identityhttp.loginRequest'
                description: Login credentials
                required: true
                x-originalParamName: request
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/response.Response'
                                    - properties:
                                        data:
                                            $ref: '#/components/schemas/identityin.TokenResponse'
                                      type: object
                    description: OK
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.ErrorResponse'
                    description: Validation error
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.Response'
                    description: Invalid credentials
            summary: Authenticate a user
            tags:
                - identity
    /auth/logout:
        post:
            description: Revokes the session associated with the given refresh token.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/identityhttp.logoutRequest'
                description: Refresh token to revoke
                required: true
                x-originalParamName: request
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.Response'
                    description: OK
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.ErrorResponse'
                    description: Validation error
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.Response'
                    description: Invalid or expired refresh token
            summary: Log out a user
            tags:
                - identity
    /auth/me:
        get:
            description: Returns the profile of the user identified by the bearer token.
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/response.Response'
                                    - properties:
                                        data:
                                            $ref: '#/components/schemas/identityhttp.User'
                                      type: object
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.Response'
                    description: Missing or invalid access token
            security:
                - BearerAuth: []
            summary: Get the authenticated user
            tags:
                - identity
    /auth/refresh:
        post:
            description: Exchanges a valid refresh token for a new access/refresh token pair.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/identityhttp.refreshRequest'
                description: Refresh token
                required: true
                x-originalParamName: request
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/response.Response'
                                    - properties:
                                        data:
                                            $ref: '#/components/schemas/identityin.TokenResponse'
                                      type: object
                    description: OK
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.ErrorResponse'
                    description: Validation error
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.Response'
                    description: Invalid or expired refresh token
            summary: Refresh an access token
            tags:
                - identity
    /categories:
        get:
            description: Returns item categories ordered by name. Requires an access token.
            parameters:
                - description: Maximum number of categories to return (default 100, max 100)
                  in: query
                  name: limit
                  schema:
                    type: integer
                - description: Number of categories to skip (default 0)
                  in: query
                  name: offset
                  schema:
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/response.Response'
                                    - properties:
                                        data:
                                            items:
                                                $ref: '#/components/schemas/category.ItemCategoryResponse'
                                            type: array
                                      type: object
                    description: OK
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.Response'
                    description: Invalid pagination parameters
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.Response'
                    description: Missing or invalid access token
            security:
                - BearerAuth: []
            summary: List item categories
            tags:
                - category
        post:
            description: Creates an item category. Requires an admin access token.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/category.CreateItemCategoryRequest'
                description: Category details
                required: true
                x-originalParamName: request
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/response.Response'
                                    - properties:
                                        data:
                                            $ref: '#/components/schemas/category.ItemCategoryResponse'
                                      type: object
                    description: Created
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.ErrorResponse'
                    description: Validation error
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.Response'
                    description: Missing or invalid access token
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.Response'
                    description: Admin role required
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.Response'
                    description: Category name already exists
            security:
                - BearerAuth: []
            summary: Create an item category
            tags:
                - category
    /categories/{id}:
        get:
            description: Returns a single item category by ID. Requires an access token.
            parameters:
                - description: Category ID
                  in: path
                  name: id
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/response.Response'
                                    - properties:
                                        data:
                                            $ref: '#/components/schemas/category.ItemCategoryResponse'
                                      type: object
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.Response'
                    description: Missing or invalid access token
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.Response'
                    description: Category not found
            security:
                - BearerAuth: []
            summary: Get an item category
            tags:
                - category
        patch:
            description: Partially updates an item category's name and description. Every field is optional, but at least one of name or description must be provided. Requires an admin access token.
            parameters:
                - description: Category ID
                  in: path
                  name: id
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/category.UpdateItemCategoryRequest'
                description: Fields to update
                required: true
                x-originalParamName: request
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/response.Response'
                                    - properties:
                                        data:
                                            $ref: '#/components/schemas/category.ItemCategoryResponse'
                                      type: object
                    description: OK
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.ErrorResponse'
                    description: Validation error or no name/description provided
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.Response'
                    description: Missing or invalid access token
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.Response'
                    description: Admin role required
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.Response'
                    description: Category not found
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.Response'
                    description: Category name already exists
            security:
                - BearerAuth: []
            summary: Update an item category
            tags:
                - category
    /categories/{id}/activate:
        patch:
            description: Marks an item category as active. Requires an admin access token.
            parameters:
                - description: Category ID
                  in: path
                  name: id
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/response.Response'
                                    - properties:
                                        data:
                                            $ref: '#/components/schemas/category.ItemCategoryResponse'
                                      type: object
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.Response'
                    description: Missing or invalid access token
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.Response'
                    description: Admin role required
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.Response'
                    description: Category not found
            security:
                - BearerAuth: []
            summary: Activate an item category
            tags:
                - category
    /categories/{id}/deactivate:
        patch:
            description: Marks an item category as inactive. Requires an admin access token.
            parameters:
                - description: Category ID
                  in: path
                  name: id
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/response.Response'
                                    - properties:
                                        data:
                                            $ref: '#/components/schemas/category.ItemCategoryResponse'
                                      type: object
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.Response'
                    description: Missing or invalid access token
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.Response'
                    description: Admin role required
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.Response'
                    description: Category not found
            security:
                - BearerAuth: []
            summary: Deactivate an item category
            tags:
                - category
    /categories/{id}/items:
        get:
            description: Returns items belonging to the specified category. Requires an access token.
            parameters:
                - description: Category ID
                  in: path
                  name: id
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/response.Response'
                                    - properties:
                                        data:
                                            items:
                                                $ref: '#/components/schemas/item.ItemResponse'
                                            type: array
                                      type: object
                    description: OK
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.Response'
                    description: Invalid category ID
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.Response'
                    description: Missing or invalid access token
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.Response'
                    description: Category not found
            security:
                - BearerAuth: []
            summary: List items in a category
            tags:
                - category
    /departments:
        get:
            description: Returns every department, ordered by name.
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/response.Response'
                                    - properties:
                                        data:
                                            items:
                                                $ref: '#/components/schemas/departmenthttp.DepartmentResponse'
                                            type: array
                                      type: object
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.Response'
                    description: Missing or invalid access token
            security:
                - BearerAuth: []
            summary: List departments
            tags:
                - department
        post:
            description: Creates a new department with the given name, description and code.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/departmenthttp.CreateDepartmentRequest'
                description: Department details
                required: true
                x-originalParamName: request
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/response.Response'
                                    - properties:
                                        data:
                                            $ref: '#/components/schemas/departmentin.CreateDepartmentResult'
                                      type: object
                    description: Created
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.ErrorResponse'
                    description: Validation error
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.Response'
                    description: Missing or invalid access token
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.Response'
                    description: Department already exists
            security:
                - BearerAuth: []
            summary: Create a department
            tags:
                - department
    /departments/{id}:
        get:
            description: Returns a single department by its id.
            parameters:
                - description: Department id
                  in: path
                  name: id
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/response.Response'
                                    - properties:
                                        data:
                                            $ref: '#/components/schemas/departmentin.DepartmentResult'
                                      type: object
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.Response'
                    description: Missing or invalid access token
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.Response'
                    description: Department not found
            security:
                - BearerAuth: []
            summary: Get a department
            tags:
                - department
    /invitations/{token}/accept:
        post:
            description: Completes registration for the invitee using the invitation token.
            parameters:
                - description: Invitation token
                  in: path
                  name: token
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/invitationhttp.AcceptInvitationRequest'
                description: Registration details
                required: true
                x-originalParamName: request
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.Response'
                    description: OK
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.ErrorResponse'
                    description: Validation error
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.Response'
                    description: Invitation not found
            summary: Accept an invitation
            tags:
                - invitation
    /invitations/{token}/validate:
        get:
            description: Checks whether an invitation token is still valid and returns the prefilled registration details for the invitee.
            parameters:
                - description: Invitation token
                  in: path
                  name: token
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/response.Response'
                                    - properties:
                                        data:
                                            $ref: '#/components/schemas/invitationhttp.ValidateInvitationResponse'
                                      type: object
                    description: OK
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.ErrorResponse'
                    description: Token is missing
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.Response'
                    description: Invitation not found
            summary: Validate an invitation token
            tags:
                - invitation
    /items:
        get:
            description: Returns items ordered by name. Requires an access token.
            parameters:
                - description: Maximum number of items to return (default 100, max 100)
                  in: query
                  name: limit
                  schema:
                    type: integer
                - description: Number of items to skip (default 0)
                  in: query
                  name: offset
                  schema:
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/response.Response'
                                    - properties:
                                        data:
                                            items:
